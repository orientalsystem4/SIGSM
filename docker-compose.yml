services:
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      # Monta el código fuente en la ruta esperada por la aplicación
      - ./src:/var/www/html/SIGSM
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: mariadb:10.4
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - db_data:/var/lib/mysql
      # Auto-importa el volcado SQL al levantar el contenedor por primera vez
      - ./src/documentacion/sigsm.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306"

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: ${DB_PASS}
    depends_on:
      - db

volumes:
  db_data: