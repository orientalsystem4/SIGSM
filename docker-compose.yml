services:
  web:
    build: .
    restart: unless-stopped
    ports:
      # Solo el Apache del host (proxy inverso) debe llegar a este puerto
      - "127.0.0.1:8080:80"
    volumes:
      # Monta el código fuente en la ruta esperada por la aplicación
      - ./src:/var/www/html/SIGSM
      - ./bin:/var/www/html/SIGSM/bin
      # Subidas fuera del repositorio: sobreviven a git pull y a recrear el contenedor
      - /var/lib/sigsm/documentos:/var/www/html/SIGSM/moduloDocumentacion/Vista/documentos
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:10.11
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
      MYSQL_DATABASE: ${DB_NAME}
      # Actualiza las tablas de sistema si el volumen viene de una version anterior (10.4)
      MARIADB_AUTO_UPGRADE: "1"
      # NOW() y CURRENT_TIMESTAMP en hora de Uruguay
      TZ: America/Montevideo
    healthcheck:
      # Script oficial de la imagen: conecta por TCP y confirma que InnoDB termino de iniciar
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    volumes:
      - db_data:/var/lib/mysql
      # Auto-importa el volcado SQL al levantar el contenedor por primera vez
      - ./src/documentacion/sigsm.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "127.0.0.1:3306:3306"

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: unless-stopped
    # Solo con: docker compose --profile debug up -d
    profiles: ["debug"]
    ports:
      - "127.0.0.1:8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: ${DB_PASS}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
